# /etc/nginx/sites-available/sideroad  (replace the domain, symlink into sites-enabled)
# nginx must be in the sideroad group to use the socket:  usermod -aG sideroad www-data && systemctl restart nginx
# HTTPS: certbot --nginx -d sideroad.example.ca   (adds the 443 block and redirect)
server {
    listen 80;
    listen [::]:80;
    server_name sideroad.example.ca;

    client_max_body_size 12m;

    location / {
        proxy_pass http://unix:/run/sideroad/sideroad.sock;
        proxy_set_header Host $host;
        # Overwrite, don't append: the client's own X-Forwarded-For is never passed on.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
